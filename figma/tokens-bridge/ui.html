<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #15171a;
        color: #ffffff;
        font:
          12px/1.5 'Instrument Sans',
          -apple-system,
          system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .hint {
        margin: 0 0 12px;
        color: #bfc0c2;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        padding: 6px 12px;
        border: 1px solid #94969a;
        border-radius: 4px;
        background: #ffc800;
        color: #292d34;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        border-color: #62656a;
        background: #3a3d42;
        color: #bfc0c2;
        cursor: default;
      }
      pre {
        margin: 12px 0 0;
        padding: 8px;
        border-radius: 4px;
        background: #08090a;
        color: #bfc0c2;
        font:
          11px/1.4 ui-monospace,
          monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Kiter Token Bridge</h1>
    <p class="hint" id="document">Reading the document…</p>
    <div class="actions">
      <button id="push">Push repo → Figma</button>
      <button id="pull">Pull Figma → repo</button>
    </div>
    <pre id="log">Ready.</pre>

    <script>
      const BASE = 'http://localhost:4747'
      const HINT = 'Start the bridge with `pnpm tokens:bridge`.'
      const log = document.getElementById('log')
      const documentLine = document.getElementById('document')
      const pushButton = document.getElementById('push')
      const pullButton = document.getElementById('pull')

      let lines = ['Ready.']
      let waiting = null

      function reset(line) {
        lines = [line]
        log.textContent = lines.join('\n')
      }

      function append(line) {
        lines.push(line)
        log.textContent = lines.join('\n')
      }

      function setBusy(busy) {
        pushButton.disabled = busy
        pullButton.disabled = busy
      }

      function serverError(message) {
        const error = new Error(message)
        error.server = true
        return error
      }

      // One sandbox request at a time: a button is disabled while it waits.
      function ask(message, resultType) {
        return new Promise((resolve, reject) => {
          waiting = { type: resultType, resolve, reject }
          parent.postMessage({ pluginMessage: message }, '*')
        })
      }

      async function fetchJson(path, options) {
        let response
        try {
          response = await fetch(BASE + path, options)
        } catch (error) {
          throw serverError('cannot reach ' + BASE + ': ' + error.message)
        }
        const text = await response.text()
        let body
        try {
          body = JSON.parse(text)
        } catch {
          body = null
        }
        if (!response.ok) {
          const detail = body && body.error ? body.error : text
          throw serverError('HTTP ' + response.status + ': ' + detail)
        }
        return body || {}
      }

      function countLeaves(node) {
        if (typeof node === 'string' || typeof node === 'number') {
          return 1
        }
        if (!node || typeof node !== 'object') {
          return 1
        }
        if (Array.isArray(node)) {
          return 1
        }
        if (typeof node.alias === 'string' || typeof node.r === 'number') {
          return 1
        }
        let total = 0
        for (const key of Object.keys(node)) {
          total += countLeaves(node[key])
        }
        return total
      }

      function describeValue(value) {
        if (value === undefined || value === null) {
          return String(value)
        }
        if (typeof value === 'object') {
          return JSON.stringify(value)
        }
        return String(value)
      }

      function fail(label, error, hint) {
        append('✗ ' + label + ' failed: ' + error.message)
        if (hint) {
          append(HINT)
        }
      }

      function styleCount(styles, kind) {
        return (styles && styles[kind]) || {}
      }

      function countsLine(counts) {
        return (
          (counts.created || 0) +
          ' created, ' +
          (counts.updated || 0) +
          ' updated, ' +
          (counts.skipped || 0) +
          ' skipped'
        )
      }

      function appendSkipped(label, counts) {
        const names = counts.skippedNames || []
        if (names.length === 0) {
          return
        }
        append('Skipped ' + label + ':')
        for (const name of names) {
          append('  ' + name)
        }
      }

      // A text style binds its size and letter spacing to the variables the
      // tokens already own, so the style stops carrying a second copy of those
      // values. A property that kept its literal is reported with its reason.
      function appendBindings(counts) {
        const bindings = counts.bindings || {}
        const properties = Object.keys(bindings)
        if (properties.length === 0) {
          return
        }
        const parts = []
        for (const property of properties) {
          const entry = bindings[property] || {}
          parts.push(
            property +
              ': ' +
              (entry.bound || 0) +
              ' bound, ' +
              (entry.failed || 0) +
              ' left as a literal',
          )
        }
        append('Text style bindings: ' + parts.join('; '))

        const issues = counts.bindingIssues || []
        if (issues.length === 0) {
          return
        }
        const partial = counts.partiallyBoundNames || []
        const reasons = new Map()
        for (const issue of issues) {
          const name = issue.name || '(unnamed style)'
          if (!reasons.has(name)) {
            reasons.set(name, [])
          }
          reasons.get(name).push(issue.property + ' ' + issue.reason)
        }
        append('Text styles with unbound properties:')
        for (const [name, entries] of reasons) {
          append(
            '  ' +
              name +
              ': ' +
              entries.join(', ') +
              (partial.indexOf(name) === -1 ? '' : ' (partially bound)'),
          )
        }
      }

      async function push() {
        reset('GET ' + BASE + '/push')
        try {
          const body = await fetchJson('/push')
          const styles = body.styles || {}
          append('Repo: ' + countLeaves(body.tokens) + ' tokens')
          append(
            'Repo: ' +
              (styles.text || []).length +
              ' text styles, ' +
              (styles.effects || []).length +
              ' effect styles',
          )
          const result = await ask(
            { type: 'push', tokens: body.tokens, styles: body.styles },
            'push-result',
          )
          const variables = result.variables || {}
          const written = result.styles || {}
          const text = styleCount(written, 'text')
          const effects = styleCount(written, 'effects')
          append('Figma variables: ' + countsLine(variables))
          append('Figma text styles: ' + countsLine(text))
          append('Figma effect styles: ' + countsLine(effects))
          appendBindings(text)
          appendSkipped('text styles', text)
          appendSkipped('effect styles', effects)
          append('✓ Push done.')
        } catch (error) {
          fail('Push', error, error.server === true)
        }
      }

      async function pull() {
        reset('Reading the local variables…')
        try {
          const fromFigma = await ask({ type: 'pull' }, 'pull-result')
          const tokens = fromFigma.tokens
          append('Figma: ' + countLeaves(tokens) + ' variables')
          const body = await fetchJson('/pull', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ tokens }),
          })
          const report = body.report || {}
          const changed = report.changed || []
          const added = report.added || []
          const written = body.written || []
          append('changed: ' + changed.length)
          for (const change of changed) {
            append(
              '  ' +
                change.path +
                ': ' +
                describeValue(change.from) +
                ' → ' +
                describeValue(change.to),
            )
          }
          append('added: ' + added.length)
          for (const path of added) {
            append('  ' + path)
          }
          append(
            'written: ' + (written.length === 0 ? 'none' : written.join(', ')),
          )
          append(
            '✓ Pull done: ' +
              changed.length +
              ' changed, ' +
              added.length +
              ' added.',
          )
        } catch (error) {
          fail('Pull', error, error.server === true)
        }
      }

      function renderDocument(message) {
        if (!message.supported) {
          documentLine.textContent =
            'figma.variables is not available in this file.'
          return
        }
        const collections = (message.collections || [])
          .map((entry) => entry.name + ' (' + entry.count + ')')
          .join(', ')
        documentLine.textContent =
          message.total +
          ' local variables' +
          (collections ? ': ' + collections : '')
      }

      window.onmessage = (event) => {
        const message = event.data.pluginMessage
        if (!message) {
          return
        }
        if (message.type === 'document') {
          renderDocument(message)
          return
        }
        if (!waiting) {
          return
        }
        const pending = waiting
        if (message.type === 'error') {
          waiting = null
          pending.reject(new Error(message.error))
          return
        }
        if (message.type === pending.type) {
          waiting = null
          pending.resolve(message)
        }
      }

      const withBusy = (task) => async () => {
        setBusy(true)
        try {
          await task()
        } finally {
          setBusy(false)
        }
      }

      pushButton.addEventListener('click', withBusy(push))
      pullButton.addEventListener('click', withBusy(pull))

      parent.postMessage({ pluginMessage: { type: 'describe' } }, '*')
    </script>
  </body>
</html>
