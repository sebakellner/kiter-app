<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #15171a;
        color: #ffffff;
        font:
          12px/1.5 'Instrument Sans',
          -apple-system,
          system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 600;
      }
      .hint {
        margin: 0 0 12px;
        color: #bfc0c2;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        padding: 6px 12px;
        border: 1px solid #94969a;
        border-radius: 4px;
        background: #ffc800;
        color: #292d34;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        border-color: #62656a;
        background: #3a3d42;
        color: #bfc0c2;
        cursor: default;
      }
      pre {
        margin: 12px 0 0;
        padding: 8px;
        border-radius: 4px;
        background: #08090a;
        color: #bfc0c2;
        font:
          11px/1.4 ui-monospace,
          monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Kiter Token Bridge</h1>
    <p class="hint" id="document">Reading the document…</p>
    <div class="actions">
      <button id="push">Push repo → Figma</button>
      <button id="pull">Pull Figma → repo</button>
      <button id="pull-styles">Pull styles → repo</button>
      <button id="purge">Purge parked variables</button>
    </div>
    <pre id="log">Ready.</pre>

    <script>
      const BASE = 'http://localhost:4747'
      const HINT = 'Start the bridge with `pnpm tokens:bridge`.'
      const log = document.getElementById('log')
      const documentLine = document.getElementById('document')
      const pushButton = document.getElementById('push')
      const pullButton = document.getElementById('pull')
      const pullStylesButton = document.getElementById('pull-styles')
      const purgeButton = document.getElementById('purge')

      let lines = ['Ready.']
      let waiting = null

      function reset(line) {
        // A confirmation belongs to the plan the panel is showing. Any other
        // action drops it, so a stale click can never purge a list that is no
        // longer on screen.
        clearPurgeConfirmation()
        lines = [line]
        log.textContent = lines.join('\n')
      }

      function append(line) {
        lines.push(line)
        log.textContent = lines.join('\n')
      }

      function setBusy(busy) {
        pushButton.disabled = busy
        pullButton.disabled = busy
        pullStylesButton.disabled = busy
        purgeButton.disabled = busy
      }

      function serverError(message) {
        const error = new Error(message)
        error.server = true
        return error
      }

      // One sandbox request at a time: a button is disabled while it waits.
      function ask(message, resultType) {
        return new Promise((resolve, reject) => {
          waiting = { type: resultType, resolve, reject }
          parent.postMessage({ pluginMessage: message }, '*')
        })
      }

      async function fetchJson(path, options) {
        let response
        try {
          response = await fetch(BASE + path, options)
        } catch (error) {
          throw serverError('cannot reach ' + BASE + ': ' + error.message)
        }
        const text = await response.text()
        let body
        try {
          body = JSON.parse(text)
        } catch {
          body = null
        }
        if (!response.ok) {
          const detail = body && body.error ? body.error : text
          throw serverError('HTTP ' + response.status + ': ' + detail)
        }
        return body || {}
      }

      function countLeaves(node) {
        if (typeof node === 'string' || typeof node === 'number') {
          return 1
        }
        if (!node || typeof node !== 'object') {
          return 1
        }
        if (Array.isArray(node)) {
          return 1
        }
        if (typeof node.alias === 'string' || typeof node.r === 'number') {
          return 1
        }
        let total = 0
        for (const key of Object.keys(node)) {
          total += countLeaves(node[key])
        }
        return total
      }

      function describeValue(value) {
        if (value === undefined || value === null) {
          return String(value)
        }
        if (typeof value === 'object') {
          return JSON.stringify(value)
        }
        return String(value)
      }

      // A changed entry names the property and shows the reference it came from
      // next to the one it becomes.
      function appendStyleChanges(changed) {
        for (const entry of changed) {
          const current = entry.current || {}
          const next = entry.next || {}
          const differences = []
          for (const property of Object.keys(next)) {
            if (
              describeValue(current[property]) === describeValue(next[property])
            ) {
              continue
            }
            differences.push(
              property +
                ': ' +
                describeValue(current[property]) +
                ' → ' +
                describeValue(next[property]),
            )
          }
          append(
            '  ' + (entry.name || entry.path) + ': ' + differences.join('; '),
          )
        }
      }

      // Deleting cannot be undone from the plugin, so the button asks for the
      // plan first and only the second click removes anything.
      async function purgePlan() {
        reset('Reading the parked variables…')
        try {
          const result = await ask({ type: 'purge-plan' }, 'purge-plan-result')
          const plan = result.plan || {}
          const names = plan.names || []
          const windowDays = plan.windowDays || 0
          if (names.length === 0) {
            append(
              'Parked for more than ' +
                windowDays +
                ' days: none. A parked variable is only purged after that.',
            )
            append('✓ Nothing to purge.')
            return
          }
          append(
            'Parked for more than ' + windowDays + ' days: ' + names.length,
          )
          for (const name of names) {
            append('  ' + name)
          }
          append(
            'A purge is irreversible: it also unbinds whatever still uses it.',
          )
          purgeButton.textContent = 'Confirm purge (' + names.length + ')'
          purgeButton.dataset.names = JSON.stringify(names)
          return
        } catch (error) {
          fail('Purge plan', error, error.server === true)
        }
      }

      async function confirmPurge() {
        const names = JSON.parse(purgeButton.dataset.names || '[]')
        reset('Purging ' + names.length + ' parked variables…')
        clearPurgeConfirmation()
        try {
          const result = await ask({ type: 'purge', names }, 'purge-result')
          const counts = result.counts || {}
          append('Purged: ' + (counts.removed || 0))
          const skipped = counts.skippedNames || []
          if (skipped.length > 0) {
            append('Not purged (missing, not parked, or too recent):')
            for (const name of skipped) {
              append('  ' + name)
            }
          }
          append('✓ Purge done.')
        } catch (error) {
          fail('Purge', error, error.server === true)
        }
      }

      function clearPurgeConfirmation() {
        purgeButton.textContent = 'Purge parked variables'
        delete purgeButton.dataset.names
      }

      async function purge() {
        if (purgeButton.dataset.names) {
          await confirmPurge()
          return
        }
        await purgePlan()
      }

      function fail(label, error, hint) {
        append('✗ ' + label + ' failed: ' + error.message)
        if (hint) {
          append(HINT)
        }
      }

      function styleCount(styles, kind) {
        return (styles && styles[kind]) || {}
      }

      function countsLine(counts) {
        const parts = [
          (counts.created || 0) + ' created',
          (counts.updated || 0) + ' updated',
          (counts.skipped || 0) + ' skipped',
        ]
        if (typeof counts.parked === 'number') {
          parts.push(counts.parked + ' parked')
        }
        return parts.join(', ')
      }

      // Parking renames the variable to `_stale/<date>/…` instead of copying it:
      // the id and every mode's value stay, so nothing that points at it breaks.
      function appendParked(counts) {
        const names = counts.parkedNames || []
        if (names.length === 0) {
          return
        }
        append('Parked as stale (renamed, keeps its id and values):')
        for (const name of names) {
          append('  ' + name)
        }
      }

      function appendSkipped(label, counts) {
        const names = counts.skippedNames || []
        if (names.length === 0) {
          return
        }
        append('Skipped ' + label + ':')
        for (const name of names) {
          append('  ' + name)
        }
      }

      // A text style binds its size and letter spacing to the variables the
      // tokens already own, so the style stops carrying a second copy of those
      // values. A property that kept its literal is reported with its reason.
      function appendBindings(counts) {
        const bindings = counts.bindings || {}
        const properties = Object.keys(bindings)
        if (properties.length === 0) {
          return
        }
        const parts = []
        for (const property of properties) {
          const entry = bindings[property] || {}
          parts.push(
            property +
              ': ' +
              (entry.bound || 0) +
              ' bound, ' +
              (entry.failed || 0) +
              ' left as a literal',
          )
        }
        append('Text style bindings: ' + parts.join('; '))

        const issues = counts.bindingIssues || []
        if (issues.length === 0) {
          return
        }
        const partial = counts.partiallyBoundNames || []
        const reasons = new Map()
        for (const issue of issues) {
          const name = issue.name || '(unnamed style)'
          if (!reasons.has(name)) {
            reasons.set(name, [])
          }
          reasons.get(name).push(issue.property + ' ' + issue.reason)
        }
        append('Text styles with unbound properties:')
        for (const [name, entries] of reasons) {
          append(
            '  ' +
              name +
              ': ' +
              entries.join(', ') +
              (partial.indexOf(name) === -1 ? '' : ' (partially bound)'),
          )
        }
      }

      async function push() {
        reset('GET ' + BASE + '/push')
        try {
          const body = await fetchJson('/push')
          const styles = body.styles || {}
          append('Repo: ' + countLeaves(body.tokens) + ' tokens')
          append(
            'Repo: ' +
              (styles.text || []).length +
              ' text styles, ' +
              (styles.effects || []).length +
              ' effect styles',
          )
          const result = await ask(
            { type: 'push', tokens: body.tokens, styles: body.styles },
            'push-result',
          )
          const variables = result.variables || {}
          const written = result.styles || {}
          const text = styleCount(written, 'text')
          const effects = styleCount(written, 'effects')
          append('Figma variables: ' + countsLine(variables))
          appendParked(variables)
          append('Figma text styles: ' + countsLine(text))
          append('Figma effect styles: ' + countsLine(effects))
          appendBindings(text)
          appendSkipped('text styles', text)
          appendSkipped('effect styles', effects)
          append('✓ Push done.')
        } catch (error) {
          fail('Push', error, error.server === true)
        }
      }

      async function pull() {
        reset('Reading the local variables…')
        try {
          const fromFigma = await ask({ type: 'pull' }, 'pull-result')
          const tokens = fromFigma.tokens
          append('Figma: ' + countLeaves(tokens) + ' variables')
          const body = await fetchJson('/pull', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ tokens }),
          })
          const report = body.report || {}
          const changed = report.changed || []
          const added = report.added || []
          const written = body.written || []
          append('changed: ' + changed.length)
          for (const change of changed) {
            append(
              '  ' +
                change.path +
                ': ' +
                describeValue(change.from) +
                ' → ' +
                describeValue(change.to),
            )
          }
          append('not written: ' + added.length)
          for (const path of added) {
            append(
              '  ' + path + ' -- the folder in this name owns no such token',
            )
          }
          append(
            'written: ' + (written.length === 0 ? 'none' : written.join(', ')),
          )
          append(
            'styles: push-only -- a text or effect style edited here does not come back',
          )
          append(
            '✓ Pull done: ' +
              changed.length +
              ' changed, ' +
              added.length +
              ' not written.',
          )
        } catch (error) {
          fail('Pull', error, error.server === true)
        }
      }

      async function pullStyles() {
        reset('Reading the local text styles…')
        try {
          const fromFigma = await ask(
            { type: 'pull-styles' },
            'pull-styles-result',
          )
          const styles = fromFigma.styles || []
          append('Figma: ' + styles.length + ' text styles')
          const body = await fetchJson('/pull-styles', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ styles }),
          })
          const report = body.report || {}
          const changed = report.changed || []
          const unchanged = report.unchanged || []
          const unmatched = report.unmatched || []
          const diverged = report.diverged || []
          const missingToken = report.missingToken || []
          append('changed: ' + changed.length)
          appendStyleChanges(changed)
          append('unchanged: ' + unchanged.length)
          append('unmatched: ' + unmatched.length)
          for (const entry of unmatched) {
            append(
              '  ' +
                entry.name +
                ': ' +
                entry.property +
                ' = ' +
                describeValue(entry.value) +
                ' has no primitive with that value',
            )
          }
          append('diverged: ' + diverged.length)
          for (const entry of diverged) {
            append(
              '  ' +
                entry.name +
                ': lineHeight ' +
                describeValue(entry.actual) +
                ' but the composite produces ' +
                describeValue(entry.expected),
            )
          }
          append('missing-token: ' + missingToken.length)
          for (const name of missingToken) {
            append('  ' + name + ': no typography token at that path')
          }
          const written = body.written || []
          append(
            'written: ' + (written.length === 0 ? 'none' : written.join(', ')),
          )
          const skipped =
            unmatched.length + diverged.length + missingToken.length
          append(
            '✓ Styles pull done: ' +
              changed.length +
              ' changed, ' +
              unchanged.length +
              ' unchanged, ' +
              skipped +
              ' not written.',
          )
        } catch (error) {
          fail('Styles pull', error, error.server === true)
        }
      }

      function renderDocument(message) {
        if (!message.supported) {
          documentLine.textContent =
            'figma.variables is not available in this file.'
          return
        }
        const collections = (message.collections || [])
          .map((entry) => entry.name + ' (' + entry.count + ')')
          .join(', ')
        documentLine.textContent =
          message.total +
          ' local variables' +
          (collections ? ': ' + collections : '')
      }

      window.onmessage = (event) => {
        const message = event.data.pluginMessage
        if (!message) {
          return
        }
        if (message.type === 'document') {
          renderDocument(message)
          return
        }
        if (!waiting) {
          return
        }
        const pending = waiting
        if (message.type === 'error') {
          waiting = null
          pending.reject(new Error(message.error))
          return
        }
        if (message.type === pending.type) {
          waiting = null
          pending.resolve(message)
        }
      }

      const withBusy = (task) => async () => {
        setBusy(true)
        try {
          await task()
        } finally {
          setBusy(false)
        }
      }

      pushButton.addEventListener('click', withBusy(push))
      pullButton.addEventListener('click', withBusy(pull))
      pullStylesButton.addEventListener('click', withBusy(pullStyles))
      purgeButton.addEventListener('click', withBusy(purge))

      parent.postMessage({ pluginMessage: { type: 'describe' } }, '*')
    </script>
  </body>
</html>
