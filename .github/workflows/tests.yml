name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:tests
        if: matrix.os == 'macos-latest'
      - run: pnpm lint
        if: matrix.os == 'macos-latest'
      - run: pnpm format:check
        if: matrix.os == 'macos-latest'
      - run: pnpm db:check
        if: matrix.os == 'macos-latest'
      - run: pnpm test
      - run: pnpm test:ui
      # Desktop builds type-check the app on each OS; do not duplicate that step.
      # Keep native ABI transitions sequential within this installation.
      - run: pnpm test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
