# Dependency updates. This configures scheduled version updates only: automatic
# security-fix pull requests also require "Dependabot security updates" to be
# enabled under Settings -> Code security, which this file cannot turn on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # Types must track the Node major this app runs, not the newest published
      # one: newer types let us write APIs that do not exist at runtime, and the
      # failure shows up in front of a user rather than in CI. Take a major
      # deliberately when the runtime moves with it.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
